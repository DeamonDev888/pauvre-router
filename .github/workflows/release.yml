name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pauvre-router-linux-amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pauvre-router-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pauvre-router-macos-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pauvre-router-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "../../../${{ matrix.artifact }}" pauvre-router

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          7z a "../../../${{ matrix.artifact }}" pauvre-router.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
