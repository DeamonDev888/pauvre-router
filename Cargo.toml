[package]
name = "pauvre-router"
version = "0.3.1"
edition = "2021"
description = "Router des Pauvres - proxy local OpenAI-compat vers les modeles gratuits OpenCode Zen, avec anti-spam, detection d'exhaustion, cascade, rotation de cles API et modes priority/roundrobin"
license = "MIT"
authors = ["DeamonDev888"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
