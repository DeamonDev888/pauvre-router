<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="subCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f3f4f6; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; fill: #9ca3af; }
    .label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #e5e7eb; }
    .subtext { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #9ca3af; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: bold; }
    .tag { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="518" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="958" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Header -->
  <text x="32" y="42" class="title">Router des Pauvres 🗑️🚀 — Architecture &amp; Request Flow</text>
  <text x="32" y="62" class="subtitle">Proxy local haute performance en Rust std-only (650 KB) • Contournement de gate Zen • Cascade multi-modèles</text>

  <!-- Status Pill Header -->
  <rect x="760" y="28" width="168" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="776" cy="42" r="5" fill="#34d399"/>
  <text x="788" y="46" class="mono" fill="#e2e8f0">PORT : 4445 (Live)</text>

  <!-- ==================== COLUMN 1: CLIENTS ==================== -->
  <g transform="translate(32, 90)">
    <rect width="180" height="390" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="20" y="28" class="tag" fill="#60a5fa">CLIENTS</text>
    <text x="14" y="54" class="label">OpenAI-Compat</text>
    <text x="14" y="70" class="subtext">Tous clients standards</text>

    <!-- Client 1: Hermes -->
    <g transform="translate(14, 90)">
      <rect width="152" height="60" rx="8" fill="url(#subCardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="24" cy="22" r="8" fill="#8b5cf6" fill-opacity="0.3"/>
      <text x="21" y="26" font-size="12" fill="#c084fc">⚡</text>
      <text x="38" y="24" class="label" font-size="12">Hermes Agent</text>
      <text x="38" y="42" class="subtext">Desktop plugin UI</text>
    </g>

    <!-- Client 2: IDE / Code -->
    <g transform="translate(14, 162)">
      <rect width="152" height="60" rx="8" fill="url(#subCardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="24" cy="22" r="8" fill="#3b82f6" fill-opacity="0.3"/>
      <text x="20" y="26" font-size="12" fill="#60a5fa">💻</text>
      <text x="38" y="24" class="label" font-size="12">VSCode / Cursor</text>
      <text x="38" y="42" class="subtext">Copilot / Continue.dev</text>
    </g>

    <!-- Client 3: Scripts -->
    <g transform="translate(14, 234)">
      <rect width="152" height="60" rx="8" fill="url(#subCardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="24" cy="22" r="8" fill="#10b981" fill-opacity="0.3"/>
      <text x="20" y="26" font-size="12" fill="#34d399">&gt;_</text>
      <text x="38" y="24" class="label" font-size="12">Scripts &amp; curl</text>
      <text x="38" y="42" class="subtext">CI/CD &amp; Python SDK</text>
    </g>

    <!-- Protocol Info -->
    <g transform="translate(14, 310)">
      <rect width="152" height="64" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="12" y="22" class="tag" fill="#9ca3af">API ENDPOINTS</text>
      <text x="12" y="38" class="mono" font-size="10">/v1/chat/completions</text>
      <text x="12" y="52" class="mono" font-size="10">/v1/models</text>
    </g>
  </g>

  <!-- Link 1: Client -> Router -->
  <path d="M 212 250 L 254 250" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="214" y="224" width="38" height="18" rx="4" fill="#0369a1"/>
  <text x="221" y="237" class="badge" fill="#ffffff">HTTP</text>

  <!-- ==================== COLUMN 2: CORE ROUTER (RUST) ==================== -->
  <g transform="translate(258, 90)">
    <rect width="360" height="390" rx="12" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Header Badge -->
    <rect x="16" y="14" width="135" height="20" rx="4" fill="#f97316" fill-opacity="0.2"/>
    <text x="24" y="28" class="tag" fill="#fb923c">RUST CORE ENGINE</text>
    <rect x="230" y="14" width="114" height="20" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="238" y="28" class="badge" fill="#34d399">STD-ONLY • 650KB</text>

    <!-- Step 1: Token Bucket & Dedup Cache -->
    <g transform="translate(16, 46)">
      <!-- Cache Box -->
      <g transform="translate(0, 0)">
        <rect width="156" height="74" rx="8" fill="url(#subCardGrad)" stroke="#30363d" stroke-width="1"/>
        <text x="10" y="18" class="label" font-size="12">⚡ Cache Dédup</text>
        <text x="10" y="34" class="subtext">SHA-256 (LRU 128 items)</text>
        <text x="10" y="48" class="subtext">TTL : 10 min</text>
        <rect x="10" y="54" width="70" height="14" rx="3" fill="#10b981" fill-opacity="0.2"/>
        <text x="14" y="64" class="badge" fill="#34d399">LATENCE 0 ms</text>
      </g>
      <!-- Token Bucket Box -->
      <g transform="translate(168, 0)">
        <rect width="160" height="74" rx="8" fill="url(#subCardGrad)" stroke="#30363d" stroke-width="1"/>
        <text x="10" y="18" class="label" font-size="12">🛡️ Anti-Spam Bucket</text>
        <text x="10" y="34" class="subtext">Par IP : rafale 5 max</text>
        <text x="10" y="48" class="subtext">20 req/min • Max 1.5 Mo</text>
        <rect x="10" y="54" width="76" height="14" rx="3" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="14" y="64" class="badge" fill="#38bdf8">MAX 3 SPAWNS</text>
      </g>
    </g>

    <!-- Step 2: Routing Engine -->
    <g transform="translate(16, 134)">
      <rect width="328" height="106" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="14" y="20" class="label" font-size="13">🎯 Moteur de Routage Intelligent</text>
      
      <!-- Submode Priority -->
      <g transform="translate(12, 32)">
        <rect width="144" height="62" rx="6" fill="#1f2937" stroke="#d97706" stroke-width="1"/>
        <text x="10" y="18" class="tag" fill="#fbbf24">MODE PRIORITY</text>
        <text x="10" y="34" class="subtext">Cascade séquentielle :</text>
        <text x="10" y="48" class="mono" font-size="10">GLM → Bunny → DeepSeek</text>
      </g>

      <!-- Submode Round Robin -->
      <g transform="translate(168, 32)">
        <rect width="148" height="62" rx="6" fill="#1f2937" stroke="#8b5cf6" stroke-width="1"/>
        <text x="10" y="18" class="tag" fill="#c084fc">FRONTIER-ROBIN</text>
        <text x="10" y="34" class="subtext">Rotation active :</text>
        <text x="10" y="48" class="mono" font-size="10">1 req = 1 modèle suivant</text>
      </g>
    </g>

    <!-- Step 3: Key Pool & Cooldown -->
    <g transform="translate(16, 252)">
      <rect width="328" height="122" rx="8" fill="url(#subCardGrad)" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="20" class="label" font-size="13">🔑 Gestionnaire de Clés &amp; Résilience</text>
      
      <!-- Flow inside Key Pool -->
      <g transform="translate(12, 32)">
        <rect width="90" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="subtext" font-size="10">Rotation Pool</text>
        <text x="8" y="32" class="mono" font-size="9">Round-robin</text>

        <path d="M 92 21 L 108 21" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

        <rect x="110" y="0" width="96" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
        <text x="116" y="16" class="tag" fill="#f87171">QUOTA 429 ?</text>
        <text x="116" y="32" class="mono" font-size="9" fill="#fca5a5">Cooldown 30m</text>

        <path d="M 208 21 L 222 21" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

        <rect x="224" y="0" width="80" height="42" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="230" y="16" class="tag" fill="#34d399">FALLBACK</text>
        <text x="230" y="32" class="mono" font-size="9" fill="#86efac">Anonyme</text>
      </g>

      <!-- Backoff info -->
      <rect x="12" y="86" width="304" height="24" rx="4" fill="#18181b"/>
      <text x="20" y="102" class="subtext" font-size="10">🔁 Auto-reanimation • Backoff exponentiel (2 min → 1 h) • 0 collision</text>
    </g>
  </g>

  <!-- Link 2: Router -> OpenCode CLI Spawner -->
  <path d="M 618 250 L 664 250" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="622" y="224" width="40" height="18" rx="4" fill="#c2410c"/>
  <text x="626" y="237" class="badge" fill="#ffffff">SPAWN</text>

  <!-- ==================== COLUMN 3: CLI GATE & MODELS ==================== -->
  <g transform="translate(670, 90)">
    <rect width="258" height="390" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- OpenCode CLI Wrapper Box -->
    <g transform="translate(14, 14)">
      <rect width="230" height="76" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="1.2"/>
      <rect x="10" y="8" width="80" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
      <text x="14" y="20" class="tag" fill="#34d399">GATE BYPASS</text>
      <text x="10" y="42" class="label" font-size="12">opencode run &lt;model&gt;</text>
      <text x="10" y="58" class="subtext">Valide TLS fingerprint + wire replay</text>
      <circle cx="212" cy="20" r="6" fill="#10b981" filter="url(#glowCyan)"/>
    </g>

    <!-- Arrow down to models -->
    <path d="M 129 100 L 129 122" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- OpenCode Zen Free Frontier Models -->
    <g transform="translate(14, 130)">
      <text x="4" y="0" class="tag" fill="#9ca3af">MODÈLES FRONTIÈRE ZEN (100% GRATUIT)</text>

      <!-- Model 1: GLM 5.3 -->
      <g transform="translate(0, 12)">
        <rect width="230" height="66" rx="8" fill="#111827" stroke="#eab308" stroke-width="1"/>
        <text x="10" y="20" class="label" font-size="12">⭐ glm-5.3-flash-free</text>
        <text x="10" y="36" class="subtext">Modèle frontière raisonnement / code</text>
        <rect x="10" y="44" width="76" height="14" rx="3" fill="#ca8a04" fill-opacity="0.2"/>
        <text x="14" y="54" class="badge" fill="#facc15">TOP QUALITÉ</text>
        <text x="156" y="54" class="mono" font-size="10">~11.3 s</text>
      </g>

      <!-- Model 2: Space Bunny -->
      <g transform="translate(0, 86)">
        <rect width="230" height="66" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1"/>
        <text x="10" y="20" class="label" font-size="12">⚡ space-bunny-free</text>
        <text x="10" y="36" class="subtext">Le sprinter ultra-rapide</text>
        <rect x="10" y="44" width="76" height="14" rx="3" fill="#0891b2" fill-opacity="0.2"/>
        <text x="14" y="54" class="badge" fill="#38bdf8">SPRINTER</text>
        <text x="160" y="54" class="mono" font-size="10" fill="#34d399">~6.0 s ⚡</text>
      </g>

      <!-- Model 3: DeepSeek V4.1 -->
      <g transform="translate(0, 160)">
        <rect width="230" height="66" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1"/>
        <text x="10" y="20" class="label" font-size="12">🧠 deepseek-v4.1-flash-free</text>
        <text x="10" y="36" class="subtext">DeepSeek V4.1 haute cadence</text>
        <rect x="10" y="44" width="76" height="14" rx="3" fill="#7c3aed" fill-opacity="0.2"/>
        <text x="14" y="54" class="badge" fill="#c084fc">EQUILIBRÉ</text>
        <text x="160" y="54" class="mono" font-size="10" fill="#34d399">~6.0 s ⚡</text>
      </g>
    </g>
  </g>
</svg>
