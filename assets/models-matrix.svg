    <!-- Latency Gauge -->
    <text x="12" y="100" class="m-metric">Latence constatée :</text>
    <text x="164" y="100" class="m-mono" fill="#34d399" font-weight="bold">6,0 s ⚡</text>
    <rect x="12" y="108" width="192" height="6" rx="3" fill="#1f2937"/>
    <rect x="12" y="108" width="90" height="6" rx="3" fill="url(#barFast)"/>

    <!-- Properties -->
    <g transform="translate(12, 130)">
      <text x="0" y="14" class="m-metric">🎯 Rôle : <tspan fill="#e5e7eb" font-weight="bold">Polyvalence V4.1</tspan></text>
      <text x="0" y="32" class="m-metric">💰 Coût : <tspan fill="#34d399" font-weight="bold">0 € (100% Free)</tspan></text>
      <text x="0" y="50" class="m-metric">⭐ Rang cascade : <tspan fill="#c084fc">Priorité #3</tspan></text>
