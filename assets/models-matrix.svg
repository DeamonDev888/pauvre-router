    <rect x="12" y="108" width="90" height="6" rx="3" fill="url(#barFast)"/>

    <!-- Properties -->
    <g transform="translate(12, 130)">
      <text x="0" y="14" class="m-metric">🎯 Rôle : <tspan fill="#e5e7eb" font-weight="bold">Requêtes express</tspan></text>
      <text x="0" y="32" class="m-metric">💰 Coût : <tspan fill="#34d399" font-weight="bold">0 € (100% Free)</tspan></text>
      <text x="0" y="50" class="m-metric">⭐ Rang cascade : <tspan fill="#38bdf8">Priorité #2</tspan></text>
      <rect x="0" y="60" width="192" height="18" rx="4" fill="#083344" fill-opacity="0.4"/>
      <text x="6" y="73" class="m-badge" fill="#67e8f9">RÉPONSES RAPIDES / CHAT</text>
    </g>
  </g>

  <!-- CARD 3: DEEPSEEK V4.1 -->
  <g transform="translate(488, 70)">
    <rect width="216" height="216" rx="10" fill="url(#cardGlm)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="12" y="12" width="90" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="18" y="25" class="m-badge" fill="#c084fc">🧠 PUISSANCE V4.1</text>

    <text x="12" y="52" class="m-title" font-size="14">deepseek-v4.1-flash</text>
