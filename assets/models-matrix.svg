      <text x="0" y="32" class="m-metric">🔄 Rotation : <tspan fill="#f472b6" font-weight="bold">GLM ➔ Bunny ➔ DS</tspan></text>
      <text x="0" y="50" class="m-metric">🛡️ Quota : <tspan fill="#34d399">Résistance x3</tspan></text>
      <rect x="0" y="60" width="192" height="18" rx="4" fill="#500724" fill-opacity="0.5"/>
      <text x="6" y="73" class="m-badge" fill="#fbcfe8">RECOMMANDÉ POUR HERMES</text>
