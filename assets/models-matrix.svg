  </defs>

  <style>
    .m-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f3f4f6; }
    .m-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #9ca3af; }
    .m-mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .m-badge { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: bold; }
    .m-metric { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #d1d5db; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="958" height="308" rx="14" fill="url(#matrixBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="24" y="34" class="m-title">⚡ Matrice des Modèles Frontière Zen (Testés en Live)</text>
  <text x="24" y="52" class="m-sub">Tous les modèles sont 100% gratuits via OpenCode Zen • Cascade automatique &amp; Round-Robin permanent</text>

  <!-- CARD 1: GLM 5.3 FLASH -->
  <g transform="translate(24, 70)">
    <rect width="216" height="216" rx="10" fill="url(#cardGlm)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="96" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="18" y="25" class="m-badge" fill="#fbbf24">⭐ NOUVEAU FRONTIÈRE</text>

    <text x="12" y="52" class="m-title" font-size="14">glm-5.3-flash-free</text>
    <text x="12" y="68" class="m-sub">Top qualité, raisonnement et code complexe</text>

    <!-- Latency Gauge -->
    <text x="12" y="100" class="m-metric">Latence constatée :</text>
    <text x="160" y="100" class="m-mono" fill="#fbbf24" font-weight="bold">11,3 s</text>
    <rect x="12" y="108" width="192" height="6" rx="3" fill="#1f2937"/>
    <rect x="12" y="108" width="170" height="6" rx="3" fill="url(#barQuality)"/>

    <!-- Properties -->
    <g transform="translate(12, 130)">
      <text x="0" y="14" class="m-metric">🎯 Rôle : <tspan fill="#e5e7eb" font-weight="bold">Chef d'orchestre</tspan></text>
      <text x="0" y="32" class="m-metric">💰 Coût : <tspan fill="#34d399" font-weight="bold">0 € (100% Free)</tspan></text>
      <text x="0" y="50" class="m-metric">⭐ Rang cascade : <tspan fill="#fbbf24">Priorité #1</tspan></text>
      <rect x="0" y="60" width="192" height="18" rx="4" fill="#78350f" fill-opacity="0.3"/>
      <text x="6" y="73" class="m-badge" fill="#fcd34d">EXCELLENCE CODE &amp; LOGIQUE</text>
    </g>
  </g>

